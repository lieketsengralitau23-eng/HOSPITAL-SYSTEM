<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account - Bophelo Link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="narrow" onload="setLogo()">
  <a class="skip" href="#main">Skip to main content</a>
  <div class="phone">
    <div class="statusbar" aria-hidden="true"><span>9:41</span><span>5G</span></div>
    <div class="topbar"><a class="back" href="index.html" aria-label="Go back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1>Create account</h1></div>
    <main id="main" class="content">
      <h2>Tell us about yourself</h2>
      <form onsubmit="return doRegister()" novalidate>
        <label class="lbl" for="fullname">Full name</label>
        <div class="field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><input id="fullname" type="text" autocomplete="name" placeholder="e.g. Debug Tau"></div>
        <label class="lbl" for="phone">Phone number</label>
        <div class="field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg><input id="phone" type="tel" autocomplete="tel" placeholder="+266 5XXX XXXX"></div>
        <label class="lbl" for="email">Email (optional)</label>
        <div class="field"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><input id="email" type="email" autocomplete="email" placeholder="name@example.com"></div>
      <label class="lbl" for="password">Create password</label>
      <div class="field">
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" oninput="showStrength()">
        <button type="button" class="show" onclick="togglePassword('password', this)" aria-label="Show password">Show</button>
      </div>
        <div class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i></div>
        <p class="muted" id="strengthText" style="font-size:12px;margin:4px 0 0">Use at least 8 characters</p>
        <label class="check"><input type="checkbox" id="terms"> I agree to the Terms and Privacy Policy</label>
        <p class="errbox" id="error" role="alert"></p>
        <button class="btn" type="submit">Create account</button>
      </form>
      <p class="center"><a class="linkbtn" href="index.html" style="display:inline-flex;align-items:center">Already have an account? Log in</a></p>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
