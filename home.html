<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Bophelo Link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="narrow" onload="loadHome()">
  <a class="skip" href="#main">Skip to main content</a>
  <div class="phone">
    <div class="statusbar" aria-hidden="true"><span>9:41</span><span>5G</span></div>
    <main id="main">
      <header class="tophero">
        <div class="hello"><div><small id="hello">Good morning,</small><h1 id="userName">Patient</h1></div>
          <a class="bellbtn" href="notifications.html" aria-label="Notifications"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span id="bellDot" class="hidden"></span></a></div>
        <form class="searchbar" onsubmit="return homeSearch()" role="search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><label class="sr" for="homeSearch">Search doctor or specialty</label><input id="homeSearch" type="search" placeholder="Search doctor or specialty"></form>
      </header>
      <div class="content nopad-top">
        <div class="section"><h2 style="font-size:16px">Upcoming appointment</h2><a class="linkbtn" href="appointments.html" style="display:flex;align-items:center">See all</a></div>
        <div id="upcoming"></div>
        <div class="section"><h2 style="font-size:16px">Quick actions</h2></div>
        <div class="quick">
          <button onclick="window.location.href='doctors.html'"><span class="ic"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>Find a doctor</button>
          <button onclick="window.location.href='appointments.html'"><span class="ic"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></span>My bookings</button>
          <button onclick="window.location.href='help.html'"><span class="ic"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></svg></span>Get help</button>
        </div>
        <a class="btn" href="doctors.html" style="margin-top:16px"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg> Book an appointment</a>
        <div id="reminderCard" class="hidden" style="margin-top:14px"></div>
        <p class="center"><button class="linkbtn" onclick="logout()">Log out</button></p>
      </div>
    </main>
    <nav class="nav" aria-label="Main menu">
      <a href="home.html" class="on" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
      <a href="doctors.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Doctors</span></a>
      <a href="appointments.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Bookings</span></a>
      <a href="notifications.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span>Alerts</span><span id="alertCount" class="hidden"></span></a>
    </nav>
  </div>
  <script src="script.js"></script>
</body>
</html>
