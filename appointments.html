<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My appointments - Bophelo Link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="loadAppointments()">
  <a class="skip" href="#main">Skip to main content</a>
  <div class="phone">
    <div class="statusbar" aria-hidden="true"><span>9:41</span><span>5G</span></div>
    <div class="topbar"><h1>My appointments</h1></div>
    <main id="main" class="content nopad-top">
      <div class="tabs" role="group" aria-label="Appointment list">
        <button id="tabUp" class="on" aria-pressed="true" onclick="chooseTab('upcoming')">Upcoming</button>
        <button id="tabPast" aria-pressed="false" onclick="chooseTab('past')">Past</button>
      </div>
      <div id="apptList" aria-live="polite"></div>
      <a class="btn outline" href="doctors.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" style="width:18px;height:18px"><path d="M12 5v14M5 12h14"/></svg> Book a new appointment</a>
    </main>
    <nav class="nav" aria-label="Main menu">
      <a href="home.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
      <a href="doctors.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Doctors</span></a>
      <a href="appointments.html" class="on" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Bookings</span></a>
      <a href="notifications.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span>Alerts</span><span id="alertCount" class="hidden"></span></a>
    </nav>
  </div>
  <script src="script.js"></script>
</body>
</html>
