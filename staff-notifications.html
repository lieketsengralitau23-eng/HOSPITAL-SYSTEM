<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - Bophelo Link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="loadStaffNotes()">
  <a class="skip" href="#main">Skip to main content</a>
  <div class="staffwrap">
    <aside class="side">
      <div class="brandrow"><span class="logo" aria-hidden="true"><svg viewBox="0 0 48 48"><path d="M5 26h9l5-12 7 24 5-16 3 4h9"/></svg></span><div><b>Bophelo Link</b><small>Staff portal</small></div></div>
      <nav aria-label="Staff menu">
        <a href="staff-schedule.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Schedule</span></a>
        <a href="staff-appointments.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Appointments</span></a>
        <a href="staff-patients.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Patients</span></a>
        <a href="staff-notifications.html" class="on" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span>Notifications</span></a>
      </nav>
      <div class="me"><span class="avatar" aria-hidden="true">KN</span><div>Karabo Nau<small>Appointment Administrator</small></div><button onclick="staffLogout()">Log out</button></div>
    </aside>
    <main id="main" class="main">
      <header>
        <div><h1>Notifications</h1><p>Messages sent to patients</p></div>
        <a href="staff-notifications.html" class="bellbtn" style="background:#fff;color:var(--ink);border:1px solid var(--line)" aria-label="Sent notifications"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg></a>
      </header>
      <table class="tbl"><caption class="sr">Messages sent to patients</caption><thead><tr><th scope="col">Patient</th><th scope="col">Message</th><th scope="col">Sent</th></tr></thead><tbody id="noteRows"></tbody></table>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
