<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a doctor - Bophelo Link</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="loadDoctors()">
  <a class="skip" href="#main">Skip to main content</a>
  <div class="phone">
    <div class="statusbar" aria-hidden="true"><span>9:41</span><span>5G</span></div>
    <div class="topbar"><a class="back" href="home.html" aria-label="Go back"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1>Find a doctor</h1></div>
    <main id="main" class="content nopad-top">
      <div class="searchbar" style="border:1px solid var(--line)"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><label class="sr" for="search">Search by name or specialty</label><input id="search" type="search" placeholder="Search name or specialty" oninput="showDoctors()"></div>
      <div class="chips" role="group" aria-label="Filter by specialty">
        <button class="chip on" aria-pressed="true" onclick="chooseSpecialty('All', this)">All</button>
        <button class="chip" aria-pressed="false" onclick="chooseSpecialty('Cardiology', this)">Cardiology</button>
        <button class="chip" aria-pressed="false" onclick="chooseSpecialty('Paediatrics', this)">Paediatrics</button>
        <button class="chip" aria-pressed="false" onclick="chooseSpecialty('General Practice', this)">General</button>
      </div>
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <span class="muted" id="count" role="status" aria-live="polite" style="font-size:13px"></span>
        <span><label for="sort" class="muted" style="font-size:13px">Sort: </label><select id="sort" onchange="changeSort()" style="border:0;background:none;font-weight:700;color:var(--brand);min-height:44px"><option value="soonest">Soonest</option><option value="name">Name (A-Z)</option></select></span>
      </div>
      <div id="doctorList"></div>
    </main>
    <nav class="nav" aria-label="Main menu">
      <a href="home.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
      <a href="doctors.html" class="on" aria-current="page"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Doctors</span></a>
      <a href="appointments.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Bookings</span></a>
      <a href="notifications.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg><span>Alerts</span><span id="alertCount" class="hidden"></span></a>
    </nav>
  </div>
  <script src="script.js"></script>
</body>
</html>
